<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>CuraTrack</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "surface-container-lowest": "#ffffff",
                      "on-primary-container": "#c4d2ff",
                      "tertiary-fixed": "#e1e0ff",
                      "error-container": "#ffdad6",
                      "on-tertiary": "#ffffff",
                      "tertiary": "#2b29bb",
                      "on-primary-fixed": "#001848",
                      "tertiary-fixed-dim": "#c0c1ff",
                      "surface-container": "#e5eeff",
                      "on-secondary-fixed": "#002113",
                      "background": "#f8f9ff",
                      "tertiary-container": "#4547d3",
                      "surface-tint": "#0c56d0",
                      "secondary-fixed": "#6ffbbe",
                      "inverse-surface": "#213145",
                      "on-error": "#ffffff",
                      "on-tertiary-fixed": "#07006c",
                      "primary-fixed-dim": "#b2c5ff",
                      "on-secondary-fixed-variant": "#005236",
                      "secondary": "#006c49",
                      "surface-container-high": "#dce9ff",
                      "on-surface-variant": "#434654",
                      "secondary-fixed-dim": "#4edea3",
                      "on-error-container": "#93000a",
                      "outline": "#737685",
                      "secondary-container": "#6cf8bb",
                      "surface": "#f8f9ff",
                      "on-tertiary-container": "#d0cfff",
                      "on-tertiary-fixed-variant": "#2f2ebe",
                      "on-secondary-container": "#00714d",
                      "surface-variant": "#d3e4fe",
                      "surface-bright": "#f8f9ff",
                      "primary": "#003d9b",
                      "on-primary-fixed-variant": "#0040a2",
                      "on-surface": "#0b1c30",
                      "primary-container": "#0052cc",
                      "primary-fixed": "#dae2ff",
                      "error": "#ba1a1a",
                      "inverse-primary": "#b2c5ff",
                      "inverse-on-surface": "#eaf1ff",
                      "on-background": "#0b1c30",
                      "outline-variant": "#c3c6d6",
                      "surface-container-highest": "#d3e4fe",
                      "surface-dim": "#cbdbf5",
                      "on-primary": "#ffffff",
                      "surface-container-low": "#eff4ff",
                      "on-secondary": "#ffffff"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "sm": "12px",
                      "margin-mobile": "20px",
                      "baseline": "4px",
                      "md": "16px",
                      "lg": "24px",
                      "xl": "32px",
                      "xs": "8px",
                      "gutter": "16px",
                      "margin-tablet": "32px"
              },
              "fontFamily": {
                      "headline-md": ["Inter"],
                      "headline-sm": ["Inter"],
                      "body-md": ["Inter"],
                      "headline-lg": ["Inter"],
                      "body-lg": ["Inter"],
                      "label-lg": ["Inter"],
                      "title-lg": ["Inter"],
                      "headline-lg-mobile": ["Inter"]
              },
              "fontSize": {
                      "headline-md": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                      "headline-sm": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                      "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                      "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                      "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                      "label-lg": ["12px", {"lineHeight": "16px", "letterSpacing": "0.5px", "fontWeight": "600"}],
                      "title-lg": ["18px", {"lineHeight": "24px", "fontWeight": "600"}],
                      "headline-lg-mobile": ["28px", {"lineHeight": "36px", "fontWeight": "700"}]
              }
            }
          }
        }
    </script>
<style>
        .fade-in-container {
            animation: gentleFadeIn 1.8s cubic-bezier(0.22, 1, 0.36, 1) forwards;
            opacity: 0;
            transform: scale(0.98);
        }
        
        .fade-in-text {
            animation: textReveal 1.5s cubic-bezier(0.22, 1, 0.36, 1) 0.6s forwards;
            opacity: 0;
            transform: translateY(10px);
        }
        
        .pulse-path {
            stroke-dasharray: 200;
            stroke-dashoffset: 200;
            animation: drawPath 2s ease-in-out 0.8s forwards;
        }

        @keyframes gentleFadeIn {
            0% { opacity: 0; transform: scale(0.95); }
            100% { opacity: 1; transform: scale(1); }
        }

        @keyframes textReveal {
            0% { opacity: 0; transform: translateY(10px); filter: blur(2px); }
            100% { opacity: 1; transform: translateY(0); filter: blur(0); }
        }

        @keyframes drawPath {
            0% { stroke-dashoffset: 200; }
            100% { stroke-dashoffset: 0; }
        }
    </style>
</head>
<body class="bg-surface-container-lowest min-h-screen w-full flex items-center justify-center m-0 p-0 overflow-hidden">
<div class="flex flex-col items-center justify-center fade-in-container px-margin-mobile text-center min-h-screen w-full">
<!-- Stylized Medical Cross + Tracking Logo -->
<svg class="w-32 h-32 text-primary mb-xl drop-shadow-sm" fill="none" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
<!-- Main Medical Cross -->
<rect fill="currentColor" height="88" opacity="0.95" rx="10" width="36" x="42" y="16"></rect>
<rect fill="currentColor" height="36" opacity="0.95" rx="10" width="88" x="16" y="42"></rect>
<!-- Inner Depth / Cutout effect for the track -->
<path d="M 0 60 L 120 60" stroke="#ffffff" stroke-linecap="round" stroke-width="8"></path>
<!-- Animated Tracking Path/Pulse -->
<path class="pulse-path" d="M 20 60 L 45 60 L 55 35 L 65 85 L 75 60 L 100 60" fill="none" filter="drop-shadow(0px 2px 4px rgba(0,0,0,0.1))" stroke="#003d9b" stroke-linecap="round" stroke-linejoin="round" stroke-width="6"></path>
<!-- Center Node -->
<circle cx="60" cy="60" fill="#ffffff" r="4"></circle>
</svg>
<!-- Brand Wordmark -->
<h1 class="font-headline-lg text-headline-lg text-primary tracking-tight">CuraTrack</h1>
<!-- Subtle Subtitle -->
<div class="fade-in-text mt-sm flex items-center gap-2">
<div class="h-px w-6 bg-primary-fixed-dim"></div>
<p class="font-label-lg text-label-lg text-on-surface-variant uppercase tracking-widest">Precision Care</p>
<div class="h-px w-6 bg-primary-fixed-dim"></div>
</div>
</div>


</body></html>
