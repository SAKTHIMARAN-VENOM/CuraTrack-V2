<!DOCTYPE html><html class="light" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>CuraTrack - Forgot Password</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "surface-container-lowest": "#ffffff",
                      "on-primary-container": "#c4d2ff",
                      "tertiary-fixed": "#e1e0ff",
                      "error-container": "#ffdad6",
                      "on-tertiary": "#ffffff",
                      "tertiary": "#2b29bb",
                      "on-primary-fixed": "#001848",
                      "tertiary-fixed-dim": "#c0c1ff",
                      "surface-container": "#e5eeff",
                      "on-secondary-fixed": "#002113",
                      "background": "#f8f9ff",
                      "tertiary-container": "#4547d3",
                      "surface-tint": "#0c56d0",
                      "secondary-fixed": "#6ffbbe",
                      "inverse-surface": "#213145",
                      "on-error": "#ffffff",
                      "on-tertiary-fixed": "#07006c",
                      "primary-fixed-dim": "#b2c5ff",
                      "on-secondary-fixed-variant": "#005236",
                      "secondary": "#006c49",
                      "surface-container-high": "#dce9ff",
                      "on-surface-variant": "#434654",
                      "secondary-fixed-dim": "#4edea3",
                      "on-error-container": "#93000a",
                      "outline": "#737685",
                      "secondary-container": "#6cf8bb",
                      "surface": "#f8f9ff",
                      "on-tertiary-container": "#d0cfff",
                      "on-tertiary-fixed-variant": "#2f2ebe",
                      "on-secondary-container": "#00714d",
                      "surface-variant": "#d3e4fe",
                      "surface-bright": "#f8f9ff",
                      "primary": "#003d9b",
                      "on-primary-fixed-variant": "#0040a2",
                      "on-surface": "#0b1c30",
                      "primary-container": "#0052cc",
                      "primary-fixed": "#dae2ff",
                      "error": "#ba1a1a",
                      "inverse-primary": "#b2c5ff",
                      "inverse-on-surface": "#eaf1ff",
                      "on-background": "#0b1c30",
                      "outline-variant": "#c3c6d6",
                      "surface-container-highest": "#d3e4fe",
                      "surface-dim": "#cbdbf5",
                      "on-primary": "#ffffff",
                      "surface-container-low": "#eff4ff",
                      "on-secondary": "#ffffff"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "sm": "12px",
                      "margin-mobile": "20px",
                      "baseline": "4px",
                      "md": "16px",
                      "lg": "24px",
                      "xl": "32px",
                      "xs": "8px",
                      "gutter": "16px",
                      "margin-tablet": "32px"
              },
              "fontFamily": {
                      "headline-md": ["Inter"],
                      "headline-sm": ["Inter"],
                      "body-md": ["Inter"],
                      "headline-lg": ["Inter"],
                      "body-lg": ["Inter"],
                      "label-lg": ["Inter"],
                      "title-lg": ["Inter"],
                      "headline-lg-mobile": ["Inter"]
              },
              "fontSize": {
                      "headline-md": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                      "headline-sm": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                      "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                      "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                      "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                      "label-lg": ["12px", {"lineHeight": "16px", "letterSpacing": "0.5px", "fontWeight": "600"}],
                      "title-lg": ["18px", {"lineHeight": "24px", "fontWeight": "600"}],
                      "headline-lg-mobile": ["28px", {"lineHeight": "36px", "fontWeight": "700"}]
              }
            }
          }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-family: 'Material Symbols Outlined';
            font-weight: normal;
            font-style: normal;
            font-size: 24px;
            line-height: 1;
            letter-spacing: normal;
            text-transform: none;
            display: inline-block;
            white-space: nowrap;
            word-wrap: normal;
            direction: ltr;
            -webkit-font-feature-settings: 'liga';
            -webkit-font-smoothing: antialiased;
        }
        
        .ambient-shadow {
            box-shadow: 0 4px 12px rgba(0, 61, 155, 0.04);
        }
    </style>
</head>
<body class="bg-background min-h-screen flex items-center justify-center p-margin-mobile min-h-screen">
<!-- Main Container -->
<main class="w-full max-w-md">
<!-- Glassmorphism Card -->
<div class="bg-surface-container-lowest rounded-[24px] border border-outline-variant/30 ambient-shadow p-lg md:p-xl relative overflow-hidden">
<!-- Decorative Accent -->
<div class="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-primary to-secondary"></div>
<!-- Header Section -->
<div class="text-center mb-xl mt-sm">
<!-- Logo Mark -->
<div class="w-16 h-16 rounded-full bg-primary-container/10 flex items-center justify-center mx-auto mb-md">
<span class="material-symbols-outlined text-primary text-[32px]" style="font-variation-settings: 'FILL' 1;">
                        lock_reset
                    </span>
</div>
<h1 class="font-headline-md text-headline-md text-on-surface mb-sm">Forgot Password</h1>
<p class="font-body-md text-body-md text-on-surface-variant">
                    Enter your email address to reset your password.
                </p>
</div>
<!-- Form Section -->
<form action="#" class="space-y-lg" method="POST">
<!-- Email Input -->
<div class="relative">
<label class="font-label-lg text-label-lg text-on-surface-variant mb-xs block" for="email">Email Address</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-md flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">mail</span>
</div>
<input class="w-full bg-surface rounded-xl border border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary py-sm pl-[48px] pr-md font-body-lg text-body-lg text-on-surface transition-colors" id="email" name="email" placeholder="patient@example.com" required="" type="email">
</div>
</div>
<!-- Actions -->
<div class="pt-sm space-y-md">
<button class="w-full bg-primary text-on-primary font-title-lg text-title-lg rounded-full py-md px-lg hover:bg-primary-fixed-variant transition-colors flex items-center justify-center gap-2" type="submit">
                        Send Reset Link
                        <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
<button class="w-full bg-transparent text-primary font-label-lg text-label-lg py-sm px-lg hover:bg-primary-container/10 rounded-full transition-colors flex items-center justify-center gap-2" type="button">
<span class="material-symbols-outlined text-[18px]">arrow_back</span>
                        Back to Login
                    </button>
</div>
</form>
</div>
<!-- Footer / Support -->
<div class="text-center mt-lg">
<p class="font-body-md text-body-md text-on-surface-variant">
                Need help? <a class="text-primary hover:underline font-600" href="#">Contact Support</a>
</p>
</div>
</main>


</body></html>
