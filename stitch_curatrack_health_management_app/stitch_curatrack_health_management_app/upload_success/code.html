<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Upload Successful - CuraTrack</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">

      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "inverse-surface": "#213145",
                    "surface-dim": "#cbdbf5",
                    "on-secondary": "#ffffff",
                    "primary-container": "#0052cc",
                    "on-surface": "#0b1c30",
                    "tertiary-fixed": "#e1e0ff",
                    "surface-container-highest": "#d3e4fe",
                    "on-secondary-fixed": "#002113",
                    "on-tertiary-fixed": "#07006c",
                    "on-error": "#ffffff",
                    "on-surface-variant": "#434654",
                    "outline": "#737685",
                    "on-tertiary": "#ffffff",
                    "primary-fixed-dim": "#b2c5ff",
                    "surface": "#f8f9ff",
                    "tertiary-container": "#4547d3",
                    "on-secondary-fixed-variant": "#005236",
                    "tertiary": "#2b29bb",
                    "outline-variant": "#c3c6d6",
                    "primary": "#003d9b",
                    "surface-tint": "#0c56d0",
                    "surface-container": "#e5eeff",
                    "surface-bright": "#f8f9ff",
                    "on-secondary-container": "#00714d",
                    "on-tertiary-fixed-variant": "#2f2ebe",
                    "on-primary-fixed-variant": "#0040a2",
                    "inverse-on-surface": "#eaf1ff",
                    "surface-container-lowest": "#ffffff",
                    "on-primary-container": "#c4d2ff",
                    "on-tertiary-container": "#d0cfff",
                    "surface-variant": "#d3e4fe",
                    "on-primary-fixed": "#001848",
                    "on-error-container": "#93000a",
                    "primary-fixed": "#dae2ff",
                    "tertiary-fixed-dim": "#c0c1ff",
                    "inverse-primary": "#b2c5ff",
                    "error-container": "#ffdad6",
                    "error": "#ba1a1a",
                    "surface-container-low": "#eff4ff",
                    "secondary-fixed": "#6ffbbe",
                    "surface-container-high": "#dce9ff",
                    "secondary": "#006c49",
                    "secondary-container": "#6cf8bb",
                    "on-background": "#0b1c30",
                    "background": "#f8f9ff",
                    "secondary-fixed-dim": "#4edea3",
                    "on-primary": "#ffffff"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "xl": "32px",
                    "md": "16px",
                    "lg": "24px",
                    "margin-mobile": "20px",
                    "gutter": "16px",
                    "baseline": "4px",
                    "xs": "8px",
                    "margin-tablet": "32px",
                    "sm": "12px"
            },
            "fontFamily": {
                    "headline-lg-mobile": ["Inter"],
                    "headline-lg": ["Inter"],
                    "body-md": ["Inter"],
                    "title-lg": ["Inter"],
                    "label-lg": ["Inter"],
                    "headline-md": ["Inter"],
                    "headline-sm": ["Inter"],
                    "body-lg": ["Inter"]
            },
            "fontSize": {
                    "headline-lg-mobile": ["28px", {"lineHeight": "36px", "fontWeight": "700"}],

                    "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}]

          }
        }
      }

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        .pulse-ring {
            animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }

        @keyframes pulse-ring {
            0% { transform: scale(0.8); box-shadow: 0 0 0 0 rgba(108, 248, 187, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 20px rgba(108, 248, 187, 0); }
            100% { transform: scale(0.8); box-shadow: 0 0 0 0 rgba(108, 248, 187, 0); }
        }

        .fade-in-up {
            animation: fadeInUp 0.6s ease-out forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        .delay-1 { animation-delay: 0.2s; }
        .delay-2 { animation-delay: 0.4s; }
        .delay-3 { animation-delay: 0.6s; }

        @keyframes fadeInUp {
            to { opacity: 1; transform: translateY(0); }
        }

        .ocr-scan-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, transparent, rgba(0, 82, 204, 0.5), transparent);
            animation: scan 3s linear infinite;
            opacity: 0.3;
            pointer-events: none;
        }

        @keyframes scan {
            0% { top: 0; }
            100% { top: 100%; }
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col items-center justify-center relative overflow-hidden font-body-md h-screen">
<!-- Top Navigation (Suppressed for Success State per guidelines, but keeping a minimal header structure if needed for context, though guidelines suggest suppressing if transactional. Suppressing full nav shell.) -->
<!-- Background decorative elements representing OCR processing/medical tech -->
<div class="absolute inset-0 pointer-events-none opacity-20">
<div class="absolute top-1/4 left-1/4 w-64 h-64 bg-primary-container rounded-full mix-blend-multiply filter blur-3xl opacity-30 animate-pulse"></div>
<div class="absolute bottom-1/4 right-1/4 w-80 h-80 bg-secondary-container rounded-full mix-blend-multiply filter blur-3xl opacity-30 animate-pulse" style="animation-delay: 1s;"></div>
<!-- Abstract Document Grid indicating processing -->
<div class="absolute top-0 right-0 w-1/3 h-full overflow-hidden flex flex-col gap-4 p-8 opacity-10">
<div class="w-full h-32 bg-surface-variant rounded-lg relative overflow-hidden">
<div class="ocr-scan-line"></div>
<div class="h-2 w-3/4 bg-outline-variant mt-4 ml-4 rounded"></div>
<div class="h-2 w-1/2 bg-outline-variant mt-2 ml-4 rounded"></div>
</div>
<div class="w-full h-24 bg-surface-variant rounded-lg relative overflow-hidden">
<div class="ocr-scan-line" style="animation-delay: 0.5s;"></div>
</div>
</div>
</div>
<!-- Main Success Container -->
<main class="w-full max-w-md px-margin-mobile relative z-10 flex flex-col items-center text-center mx-auto">
<!-- Success Icon -->
<div class="fade-in-up flex items-center justify-center mb-xl relative">
<div class="absolute inset-0 bg-secondary-container rounded-full pulse-ring blur-sm"></div>
<div class="w-24 h-24 bg-surface-container-lowest rounded-full shadow-[0_4px_12px_rgba(0,108,73,0.15)] flex items-center justify-center relative z-10 border border-secondary-container/30">
<span class="material-symbols-outlined text-[48px] text-secondary">
                    check_circle
                </span>
</div>
</div>
<!-- Typography -->
<div class="fade-in-up delay-1 mb-lg w-full">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-xs md:font-headline-lg md:text-headline-lg">
                Upload Successful
            </h1>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-xs mx-auto">
                Your document has been securely encrypted and saved to your records.
            </p>
</div>
<!-- Document Preview Card (Glassmorphism) -->
<div class="fade-in-up delay-2 w-full bg-surface-container-lowest/80 backdrop-blur-md rounded-[24px] p-lg border border-outline-variant/30 shadow-[0_4px_12px_rgba(0,61,155,0.04)] mb-xl flex items-center gap-md text-left">
<div class="w-12 h-12 bg-primary-container/10 rounded-lg flex items-center justify-center flex-shrink-0">
<span class="material-symbols-outlined text-primary">
                    description
                </span>
</div>
<div class="flex-grow overflow-hidden">
<h3 class="font-title-lg text-title-lg text-on-surface truncate">Lab_Results_Oct2023.pdf</h3>
<div class="flex items-center gap-xs mt-1">
<span class="material-symbols-outlined text-[16px] text-secondary">lock</span>
<span class="font-label-lg text-label-lg text-secondary">End-to-end encrypted</span>
</div>
</div>
<!-- Subtle background OCR indicator on the card itself -->
<div class="absolute inset-0 rounded-[24px] overflow-hidden pointer-events-none mix-blend-overlay opacity-50">
<div class="ocr-scan-line w-[200%] h-[200%] rotate-45 -top-1/2 -left-1/2 bg-gradient-to-b from-transparent via-primary-container to-transparent opacity-20"></div>
</div>
</div>
<!-- Actions -->
<div class="fade-in-up delay-3 w-full flex flex-col gap-sm">
<button class="w-full bg-primary text-on-primary font-title-lg text-title-lg py-md rounded-full hover:bg-primary/90 transition-colors shadow-[0_4px_12px_rgba(0,61,155,0.2)] flex items-center justify-center gap-xs min-h-[48px]">
                View Record
                <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
<button class="w-full bg-surface-container-highest text-on-surface font-title-lg text-title-lg py-md rounded-full hover:bg-surface-container-highest/80 transition-colors min-h-[48px] border border-outline-variant/50">
                Done
            </button>
</div>
<!-- Processing Status (Subtle Bottom Indicator) -->
<div class="fade-in-up delay-3 mt-xl flex items-center gap-2 opacity-60">
<span class="material-symbols-outlined text-[16px] text-primary animate-spin">
                sync
            </span>
<span class="font-label-lg text-label-lg text-on-surface-variant">
                Extracting clinical data via OCR...
            </span>
</div>
</main>


</body></html>
