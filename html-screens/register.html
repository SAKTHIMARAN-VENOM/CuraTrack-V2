<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CuraTrack - Register</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

  <div class="w-full max-w-[390px] h-[812px] bg-[#f8f9ff] text-slate-900 rounded-[40px] border-[8px] border-slate-900 shadow-2xl overflow-hidden flex flex-col relative">
    
    <!-- Top Status Bar -->
    <div class="bg-[#f8f9ff] px-6 py-2 flex justify-between items-center text-xs font-semibold text-[#0b1c30] shrink-0 border-b border-slate-100">
      <span>09:41</span>
      <div class="w-20 h-4 bg-slate-900 rounded-full mx-auto"></div>
      <div class="flex items-center gap-1.5 text-slate-600">
        <span class="material-symbols-outlined text-sm">signal_cellular_4_bar</span>
        <span class="material-symbols-outlined text-sm">wifi</span>
        <span class="material-symbols-outlined text-sm">battery_full</span>
      </div>
    </div>

    <!-- Screen Content Window -->
    <div class="flex-1 p-6 flex flex-col justify-between overflow-y-auto">
      
      <!-- Logo Header -->
      <div class="flex flex-col items-center text-center mt-2">
        <div class="w-14 h-14 rounded-2xl bg-[#008080] text-white flex items-center justify-center shadow-lg shadow-teal-600/30 mb-2">
          <span class="material-symbols-outlined text-2xl">person_add</span>
        </div>
        <h1 class="text-xl font-extrabold text-[#0b1c30] tracking-tight">Create Account</h1>
        <p class="text-xs text-[#434654] font-medium">Join CuraTrack V2 Health Platform</p>
      </div>

      <!-- Register Form Card -->
      <div class="bg-white p-5 rounded-3xl border border-slate-200 shadow-sm flex flex-col gap-3 my-auto">
        <form onsubmit="event.preventDefault(); window.location.href='dashboard.html';" class="flex flex-col gap-2.5 text-xs">
          <div>
            <label class="block text-[11px] font-semibold text-slate-700 mb-1">Full Name</label>
            <input
              type="text"
              placeholder="e.g. Sarah Johnson"
              required
              class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-xs font-medium text-slate-900 focus:outline-none focus:border-[#008080]"
            />
          </div>

          <div>
            <label class="block text-[11px] font-semibold text-slate-700 mb-1">Email Address</label>
            <input
              type="email"
              placeholder="sarah.johnson@example.com"
              required
              class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-xs font-medium text-slate-900 focus:outline-none focus:border-[#008080]"
            />
          </div>

          <div>
            <label class="block text-[11px] font-semibold text-slate-700 mb-1">Password</label>
            <input
              type="password"
              placeholder="Create strong password"
              required
              class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-xs font-medium text-slate-900 focus:outline-none focus:border-[#008080]"
            />
          </div>

          <button
            type="submit"
            class="w-full py-3 rounded-2xl bg-[#008080] text-white font-extrabold text-xs shadow-md hover:bg-[#006666] active:scale-95 transition-all mt-1 cursor-pointer"
          >
            Create Account
          </button>
        </form>

        <div class="relative my-1 flex items-center justify-center">
          <div class="border-t border-slate-200 w-full absolute"></div>
          <span class="bg-white px-3 text-[10px] font-bold text-slate-400 relative">OR</span>
        </div>

        <button
          type="button"
          onclick="window.location.href='dashboard.html';"
          class="w-full py-2.5 rounded-2xl bg-white border border-slate-300 text-[#0b1c30] font-bold text-xs shadow-sm hover:bg-slate-50 active:scale-95 transition-all flex items-center justify-center gap-2.5 cursor-pointer"
        >
          <svg class="w-4 h-4" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
          </svg>
          <span>Sign up with Google</span>
        </button>
      </div>

      <!-- Bottom Sign In Link -->
      <div class="text-center text-xs text-[#434654] font-medium pb-2">
        Already have an account? <a href="login.html" class="font-extrabold text-[#008080] hover:underline">Sign In</a>
      </div>

    </div>

  </div>

</body>
</html>
