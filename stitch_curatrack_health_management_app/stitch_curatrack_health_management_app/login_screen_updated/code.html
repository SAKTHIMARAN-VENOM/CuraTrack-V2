<!DOCTYPE html><html class="light" lang="en" style=""><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>CuraTrack - Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "surface-container-lowest": "#ffffff",
                      "on-primary-container": "#c4d2ff",
                      "tertiary-fixed": "#e1e0ff",
                      "error-container": "#ffdad6",
                      "on-tertiary": "#ffffff",
                      "tertiary": "#2b29bb",
                      "on-primary-fixed": "#001848",
                      "tertiary-fixed-dim": "#c0c1ff",
                      "surface-container": "#e5eeff",
                      "on-secondary-fixed": "#002113",
                      "background": "#f8f9ff",
                      "tertiary-container": "#4547d3",
                      "surface-tint": "#0c56d0",
                      "secondary-fixed": "#6ffbbe",
                      "inverse-surface": "#213145",
                      "on-error": "#ffffff",
                      "on-tertiary-fixed": "#07006c",
                      "primary-fixed-dim": "#b2c5ff",
                      "on-secondary-fixed-variant": "#005236",
                      "secondary": "#006c49",
                      "surface-container-high": "#dce9ff",
                      "on-surface-variant": "#434654",
                      "secondary-fixed-dim": "#4edea3",
                      "on-error-container": "#93000a",
                      "outline": "#737685",
                      "secondary-container": "#6cf8bb",
                      "surface": "#f8f9ff",
                      "on-tertiary-container": "#d0cfff",
                      "on-tertiary-fixed-variant": "#2f2ebe",
                      "on-secondary-container": "#00714d",
                      "surface-variant": "#d3e4fe",
                      "surface-bright": "#f8f9ff",
                      "primary": "#003d9b",
                      "on-primary-fixed-variant": "#0040a2",
                      "on-surface": "#0b1c30",
                      "primary-container": "#0052cc",
                      "primary-fixed": "#dae2ff",
                      "error": "#ba1a1a",
                      "inverse-primary": "#b2c5ff",
                      "inverse-on-surface": "#eaf1ff",
                      "on-background": "#0b1c30",
                      "outline-variant": "#c3c6d6",
                      "surface-container-highest": "#d3e4fe",
                      "surface-dim": "#cbdbf5",
                      "on-primary": "#ffffff",
                      "surface-container-low": "#eff4ff",
                      "on-secondary": "#ffffff"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "sm": "12px",
                      "margin-mobile": "20px",
                      "baseline": "4px",
                      "md": "16px",
                      "lg": "24px",
                      "xl": "32px",
                      "xs": "8px",
                      "gutter": "16px",
                      "margin-tablet": "32px"
              },
              "fontFamily": {
                      "headline-md": ["Inter"],
                      "headline-sm": ["Inter"],
                      "body-md": ["Inter"],
                      "headline-lg": ["Inter"],
                      "body-lg": ["Inter"],
                      "label-lg": ["Inter"],
                      "title-lg": ["Inter"],
                      "headline-lg-mobile": ["Inter"]
              },
              "fontSize": {
                      "headline-md": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                      "headline-sm": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                      "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                      "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                      "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                      "label-lg": ["12px", {"lineHeight": "16px", "letterSpacing": "0.5px", "fontWeight": "600"}],
                      "title-lg": ["18px", {"lineHeight": "24px", "fontWeight": "600"}],
                      "headline-lg-mobile": ["28px", {"lineHeight": "36px", "fontWeight": "700"}]
              }
      },
          },
        }
      </script>
<style>
        .shadow-ambient-lvl1 {
            box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.04);
        }
    </style>
</head>
<body class="bg-surface-container-lowest min-h-screen flex items-center justify-center p-margin-mobile min-h-screen">
<main class="w-full max-w-md mx-auto">
<!-- Header / Branding -->
<div class="text-center mb-xl"><!-- Logo Mark -->
<div class="w-16 h-16 rounded-full bg-primary-container/10 flex items-center justify-center mx-auto mb-md">
<span class="material-symbols-outlined text-primary text-[32px]" style="font-variation-settings: 'FILL' 1;">
                        lock_reset
                    </span>
</div>
<h1 class="font-headline-md text-headline-md text-on-surface mb-sm">Login</h1>
<p class="font-body-md text-body-md text-on-surface-variant">
                    Welcome back! Please enter your details.
                </p></div>
<!-- Login Form -->
<form class="bg-surface-container-lowest rounded-[24px] border border-outline-variant/30 shadow-ambient-lvl1 p-lg md:p-xl relative overflow-hidden space-y-lg"><div class="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-primary to-secondary"></div>
<!-- Email Field -->
<div class="relative">
<label class="font-label-lg text-label-lg text-on-surface-variant mb-xs block" for="email">Email Address</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-md flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">mail</span>
</div>
<input class="w-full bg-surface rounded-xl border border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary py-sm pl-[48px] pr-md font-body-lg text-body-lg text-on-surface transition-colors" id="email" name="email" placeholder="patient@example.com" required="" type="email">
</div>
</div>
<!-- Password Field -->
<div class="relative">
<label class="font-label-lg text-label-lg text-on-surface-variant mb-xs block" for="password">Password</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-md flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">lock</span>
</div>
<input class="w-full bg-surface rounded-xl border border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary py-sm pl-[48px] pr-md font-body-lg text-body-lg text-on-surface transition-colors" id="password" name="password" placeholder="Enter your password" required="" type="password">
</div>
</div><div class="pt-sm space-y-md">
<button class="w-full bg-primary text-on-primary font-title-lg text-title-lg rounded-full py-md px-lg hover:bg-primary-fixed-variant transition-colors flex items-center justify-center gap-2" type="submit">
                        Login
                        <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
<div class="flex flex-col items-center gap-sm">
<a class="font-label-lg text-label-lg text-primary hover:underline transition-colors" href="#">Forgot Password?</a>
<div class="flex items-center gap-md w-full">
<div class="h-px bg-outline-variant/30 flex-grow"></div>
<span class="text-label-lg text-on-surface-variant">Or sign in with</span>
<div class="h-px bg-outline-variant/30 flex-grow"></div>
</div>
<button class="w-12 h-12 rounded-full bg-primary-container/10 flex items-center justify-center text-primary hover:bg-primary-container/20 transition-colors active:scale-95" type="button">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">fingerprint</span>
</button>
</div>
</div>
<!-- Forgot Password Link -->
<!-- Login Button -->
</form>
<!-- Biometric / Alternative Login -->
</main>


</body></html>
