services:
  - type: web
    name: curatrack-backend
    env: python
    buildCommand: "apt-get update && apt-get install -y tesseract-ocr tesseract-ocr-eng || true; pip install -r backend/requirements.txt"
    startCommand: "cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-flash-latest
      - key: ALLOWED_ORIGINS
        value: "*"
